<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop | AI Dynamic Pricing Storefront</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }
        header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo span {
            color: #3b82f6;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .live-badge {
            background: #dcfce7;
            color: #166534;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .cart-indicator {
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 2.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1);
        }
        .banner h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .banner p {
            color: #94a3b8;
            max-width: 600px;
        }
        /* Filter Navigation Bar */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        /* Scrollable Grid Container */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            max-height: 75vh;
            overflow-y: auto;
            padding-bottom: 2rem;
        }
        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.08);
        }
        .discount-tag {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            z-index: 10;
        }
        .product-img {
            width: 100%;
            height: 200px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }
        .product-content {
            padding: 1.5rem;
        }
        .category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .product-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 12px;
        }
        .price-container {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 1rem;
        }
        .current-price {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
            transition: color 0.3s ease, transform 0.3s ease;
        }
        .current-price.updated {
            color: #16a34a;
            transform: scale(1.08);
        }
        .original-price {
            font-size: 1rem;
            color: #94a3b8;
            text-decoration: line-through;
        }
        .price-alert {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .buy-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:hover {
            background: #1d4ed8;
        }
        /* Toast Notification Styling */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .toast {
            background: #0f172a;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid #22c55e;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Smart<span>Shop</span></div>
        <div class="header-right">
            <div class="live-badge">
                <div class="pulse-dot"></div> AI Dynamic Pricing Active
            </div>
            <div class="cart-indicator">
                🛒 Cart: <span id="cart-count">0</span> items
            </div>
        </div>
    </header>

    <div class="container">
        <div class="banner">
            <h1>Welcome to SmartShop</h1>
            <p>Experience automated everyday savings driven by real-time AI demand intelligence and market elasticity models.</p>
        </div>

        <!-- Filter Category Bar -->
       <div class="filter-bar">
            <button class="filter-btn active" onclick="filterCategory('All', this)">All Products</button>
            <button class="filter-btn" onclick="filterCategory('computers_accessories', this)">Computers</button>
            <button class="filter-btn" onclick="filterCategory('health_beauty', this)">Health</button>
            <button class="filter-btn" onclick="filterCategory('watches_gifts', this)">Watches</button>
            <button class="filter-btn" onclick="filterCategory('perfumery', this)">Perfumery</button>
            <button class="filter-btn" onclick="filterCategory('garden_tools', this)">Garden</button>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Catalog rendered dynamically -->
        </div>
    </div>

    <script>
        // Extended product catalog matching database categories
       let products = [
            {
                id: 'computers_accessories', // Matches database key
                category: 'Computers & Tech',
                name: 'Pro Ultra 15" Laptop',
                price: 113.19,
                original: 130.00,
                emoji: '💻',
                msg: 'Original Fixed Price'
            },
            {
                id: 'health_beauty', // Matches database key
                category: 'Health & Beauty',
                name: 'Organic Skin Care Set',
                price: 137.81,
                original: 150.00,
                emoji: '✨',
                msg: 'Original Fixed Price'
            },
            {
                id: 'watches_gifts', // Matches database key
                category: 'Watches & Gifts',
                name: 'Luxury Chronograph Watch',
                price: 145.55,
                original: 160.00,
                emoji: '⌚',
                msg: 'Original Fixed Price'
            },
            {
                id: 'perfumery', // Matches database key
                category: 'Perfumery',
                name: 'Royal Essence Fragrance',
                price: 116.91,
                original: 130.00,
                emoji: '🌹',
                msg: 'Original Fixed Price'
            },
            {
                id: 'garden_tools', // Matches database key
                category: 'Garden Tools',
                name: 'Smart Robotic Lawn Sprinkler',
                price: 98.32,
                original: 110.00,
                emoji: '🌿',
                msg: 'Original Fixed Price'
            },
            {
                id: 'furniture_decor', // Matches database key
                category: 'Furniture & Decor',
                name: 'Minimalist LED Desk Lamp',
                price: 69.65,
                original: 80.00,
                emoji: '🛋️',
                msg: 'Original Fixed Price'
            }
        ];
        let cartCount = 0;
        let currentFilter = 'All';

        function addToCart(productName, price) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            showToast(`Added ${productName} ($${price.toFixed(2)}) to your cart!`);
        }

        function showToast(message) {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `⚡ ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function filterCategory(category, btnElement) {
            currentFilter = category;
            
            // Update active state on filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            renderProducts();
        }

        // Render catalog dynamically based on filter
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            if (!grid) return;
            grid.innerHTML = '';

            const filteredProducts = currentFilter === 'All' 
                ? products 
                : products.filter(p => p.id === currentFilter);

            filteredProducts.forEach(p => {
                const discount = p.original > p.price ? Math.round(((p.original - p.price) / p.original) * 100) : 0;
                grid.innerHTML += `
                    <div class="product-card" id="card-${p.id}">
                        ${discount > 0 ? `<div class="discount-tag">-${discount}% AI DEAL</div>` : ''}
                        <div class="product-img">${p.emoji}</div>
                        <div class="product-content">
                            <div class="category">${p.category}</div>
                            <div class="product-title">${p.name}</div>
                            <div class="price-container">
                                <span class="current-price" id="price-${p.id}">$${p.price.toFixed(2)}</span>
                                <span class="original-price" id="orig-${p.id}">$${p.original.toFixed(2)}</span>
                            </div>
                            <div class="price-alert" id="alert-${p.id}">
                                ℹ️ ${p.msg}
                            </div>
                            <button class="buy-btn" onclick="addToCart('${p.name}', ${p.price})">Add to Cart - Best Price</button>
                        </div>
                    </div>
                `;
            });
        }

        // Background poller querying python database API
        async function fetchLivePrices() {
            try {
                const response = await fetch('https://ecommerce-dynamic-pricing.onrender.com/api/prices');
                const result = await response.json();
                
                if (result.status === "success") {
                    const dbPrices = result.data;
                    
                    products.forEach(p => {
                        if (dbPrices[p.id] !== undefined && dbPrices[p.id] !== p.price) {
                            p.price = dbPrices[p.id];
                            p.msg = "AI Live Price Optimized";
                            
                            renderProducts();
                            showToast(`Price updated for ${p.name}! Now available at $${p.price.toFixed(2)}`);
                            
                            const priceEl = document.getElementById(`price-${p.id}`);
                            if(priceEl) {
                                priceEl.classList.add('updated');
                                setTimeout(() => priceEl.classList.remove('updated'), 1000);
                            }
                        }
                    });
                }
            } catch (error) {
                // Background connection check runs silently
            }
        }

        window.onload = function() {
            renderProducts();
            setInterval(fetchLivePrices, 3000); // Check database every 3 seconds
        };
    </script>
</body>
</html>
